# ======================================================================
#  SimpleDuels - config.yml  (GOLDEN theme)     edit anything, then: /duels reload
#
#  * Text uses MiniMessage:  <gold>  <bold>  <gradient:#FFE066:#FFA500>text</gradient>  <#FFD700>
#  * Placeholders look like {player}. A scoreboard line is hidden when it
#    uses a placeholder that doesn't apply (ex: {party} when you have no party).
#  * Sounds are lists of  "vanilla.sound.key volume pitch"  (empty list = silent).
#  * Arenas / kits / lobby / player settings are stored in data.yml (don't edit by hand).
# ======================================================================

general:
  footer: "<gradient:#FFE066:#FFA500>play.example.net</gradient>"
  join-message: "<gold>[+] <white>{player}"     # "" = hide the vanilla join message
  quit-message: "<gray>[-] <white>{player}"     # "" = hide the vanilla quit message
  countdown-seconds: 5
  freeze-countdown: false       # false = players can move, use pearls and build before the fight starts
  end-delay-seconds: 3          # seconds between the end of a match and the teleport to lobby
  request-expire-seconds: 60
  wind-charge-reset: true       # instant wind charge re-throw in matches
  totems-pop: true              # totems of undying work in matches
  party-max: 4
  party-invite-expire-seconds: 60   # party invites expire after this many seconds
  max-arena-volume: 300000      # max blocks of an arena region (for regen)

sounds:
  level-up:
    - "entity.player.levelup 1 1.5"
    - "entity.firework_rocket.twinkle 1 1"
  golden-head:
    - "entity.generic.eat 1 1"
  welcome:
    - "block.note_block.chime 1 1.2"
  victory:
    - "entity.player.levelup 1 1"
    - "entity.firework_rocket.blast 1 1"
  defeat:
    - "entity.wither.hurt 1 0.8"
  countdown:
    - "block.note_block.hat 1 1"
  fight:
    - "block.note_block.pling 1 2"
  eliminated:
    - "entity.lightning_bolt.thunder 0.6 1.2"
  queue-found:
    - "block.note_block.pling 1 1.5"
  request:
    - "entity.experience_orb.pickup 1 1.2"
  party-created:
    - "entity.player.levelup 0.8 1.4"
  party-invite:
    - "entity.experience_orb.pickup 1 1"
  click:
    - "ui.button.click 0.8 1"

titles:
  level-up:
    title: "<gradient:#FFE066:#FFA500><bold>LEVEL UP!</bold></gradient>"
    subtitle: "<gray>You are now level <gold>{level}"
  countdown-teams:
    title: "<gold>{count}"
    subtitle: "<gray>You are on the {team} <gray>team"
  welcome:
    title: "<gradient:#FFE066:#FFA500><bold>WELCOME</bold></gradient>"
    subtitle: "<gray>{player}"
  victory:
    title: "<gradient:#FFE066:#FFA500><bold>VICTORY!</bold></gradient>"
    subtitle: "<gray>You defeated <gold>{loser}"
  defeat:
    title: "<red><bold>DEFEAT"
    subtitle: "<gray>You lost to <gold>{winner}"
  fight:
    title: "<gold><bold>FIGHT!"
    subtitle: ""
  countdown:
    title: "<gold>{count}"
    subtitle: "<gray>vs <yellow>{opponent}"
  countdown-ffa:
    title: "<gold>{count}"
    subtitle: "<gray>Free for all"
  eliminated:
    title: "<red><bold>ELIMINATED"
    subtitle: "<gray>Your team is still fighting"
  party-created:
    title: "<gradient:#FFE066:#FFA500><bold>PARTY CREATED</bold></gradient>"
    subtitle: "<gray>Invite friends with <yellow>/party invite [player]"
  party-disbanded:
    title: "<red><bold>PARTY DISBANDED"
    subtitle: ""

messages:
  welcome:
    - ""
    - "<gradient:#FFE066:#FFA500><bold>Welcome to the server, {player}!</bold></gradient>"
    - "<gray>Right-click the <gold>sword <gray>to queue, or use <yellow>/duel [player]<gray>."
    - "<gray>Create a party with the <gold>name tag<gray>. Change options with the <gold>comparator<gray>."
    - ""

  xp-gained: "<gray>+{xp} XP"
  level-up: "<gold><bold>LEVEL UP! <gray>You are now level <gold>{level}<gray>."
  death-actionbar: "<red>{player} <dark_red>died"
  death-actionbar-killer: "<red>{player} <dark_red>died <gray>(killed by <gold>{killer}<gray>)"
  stats-line: "<gold>{player} <gray>| <yellow>Level {level} <gray>({xp} XP) | <yellow>Wins {wins} <gray>| <yellow>Losses {losses} <gray>| <yellow>Kills {kills} <gray>| <yellow>Deaths {deaths} <gray>| K/D <white>{kd}"

  no-free-arena: "<red>No free arena right now."
  no-kits: "<red>No kits yet. (Admin: build a kit then /kit create [name])"
  back-to-lobby: "<gray>Back to the lobby."

  duel-usage: "<red>/duel [player] [kit] <gray>| /duel accept | /duel deny"
  duel-party-leader-only: "<red>Only your party leader can start or accept duels."
  request-none: "<red>No pending duel request."
  player-offline: "<red>That player is offline."
  player-not-found: "<red>Player not found."
  accept-size-mismatch: "<red>Both parties must be the same size."
  someone-busy: "<red>Someone is already busy."
  request-declined: "<red>{player} declined your duel."
  request-denied-self: "<gray>Declined."
  party-challenge-leader: "<red>That player is in a party. Challenge their leader: <gold>{leader}"
  requests-off: "<red>That player isn't accepting duel requests."
  size-mismatch: "<red>Both sides must be the same size (party vs party, solo vs solo)."
  busy-any: "<red>Someone is already in a duel / spectating."
  kit-not-found: "<red>Kit not found."
  request-sent: "<yellow>Duel request sent to <gold>{player} <gray>(kit: {kit}){size}"
  request-received: "<gold>{player} <yellow>challenged you!{size} <gray>Kit: <gold>{kit} <click:run_command:'/duel accept'><#FFD700><bold>[ACCEPT]</bold></click> <click:run_command:'/duel deny'><red><bold>[DENY]</bold></click>"

  request-expired-sender: "<gray>Your duel request to <gold>{player} <gray>expired."
  request-expired-target: "<gray>The duel request from <gold>{player} <gray>expired."
  party-invite-expired-sender: "<gray>Your party invite to <gold>{player} <gray>expired."
  party-invite-expired-target: "<gray>The party invite from <gold>{player} <gray>expired."

  build-denied-lobby: "<red>You can't place blocks here."
  build-denied-countdown: "<red>You can't build right now."
  build-denied-kit: "<red>Building is disabled in this gamemode."
  build-denied-no-region: "<red>This arena has no build region. (admin: /arena corner1 + corner2)"
  build-denied-outside: "<red>You can't build outside the arena."

  spectate-usage: "<red>/spectate [player]"
  spec-while-dueling: "<red>You can't spectate while dueling."
  spec-not-dueling: "<red>That player isn't in a duel."
  spectating: "<yellow>Spectating <gold>{player}<yellow>. <gray>/leave or /lobby to exit."

  queue-left: "<yellow>You left the queue."
  queue-party-block: "<red>Leave your party to join the solo queue."
  queue-searching: "<yellow>Searching for a <gold>{kit} <yellow>match... <gray>(right-click the sword again to cancel)"
  queue-no-arena: "<red>No free arena right now, try again in a moment."
  queue-found: "<gold><bold>Match found!"

  eliminated-team: "<red>{player} <gray>was eliminated."
  eliminated-ffa: "<red>{player} <gray>was eliminated. <gold>{alive} <gray>left"
  duel-summary:
    - ""
    - "<gradient:#FFE066:#FFA500><bold>MATCH OVER</bold></gradient>"
    - "<yellow>Winner: <gold>{winner} <gray>({hp} hearts left)"
    - "<red>Loser: <white>{loser}"
    - "<gray>Duration: <white>{time} <gray>| Kit: <gold>{kit}"
    - ""

  party-created: "<yellow>Party created! <gray>/party invite [player]"
  party-need-create: "<red>Create a party first: /party create"
  party-leader-only: "<red>Only the party leader can do that."
  party-invite-usage: "<red>/party invite [player]"
  party-already-in: "<red>You're already in a party."
  party-in-other: "<red>That player is already in a party."
  party-full: "<red>Party is full."
  party-invite-sent: "<yellow>Invited <gold>{player}"
  party-invite-received: "<gold>{player} <yellow>invited you to their party! <click:run_command:'/party accept'><#FFD700><bold>[ACCEPT]</bold></click>"
  party-no-invite: "<red>No pending party invite."
  party-leave-first: "<red>Leave your party first."
  party-gone: "<red>That party no longer exists."
  party-joined: "<gold>{player} <yellow>joined the party!"
  party-left-self: "<yellow>You left the party."
  party-left: "<yellow>{player} left the party."
  party-not-in: "<red>You're not in a party."
  party-kick-usage: "<red>/party kick [player]"
  party-not-member: "<red>That player isn't in your party."
  party-kicked: "<red>You were kicked from the party."
  party-disbanded: "<red>Party disbanded."
  party-new-leader: "<gold>{player} <yellow>is now the party leader."
  party-ffa-min: "<red>You need at least 2 players in the party."
  party-ffa-busy: "<red>Someone in your party is busy."
  party-chat-usage: "<red>/party chat [message]"
  party-chat-format: "<gold>[Party] <white>{player}<gray>: <white>"
  party-list-none: "<gray>You're not in a party. <yellow>/party create <gray>| /party accept"
  party-list: "<gold>Party ({size}/{max}): <white>{members}"

  editor-start: "<gradient:#FFE066:#FFA500><bold>Kit Editor</bold></gradient> <gray>- <gold>{kit}"
  editor-buttons: "<gray>Rearrange your inventory / hotbar, then click: <click:run_command:'/kiteditor save'><#FFD700><bold>[SAVE]</bold></click> <click:run_command:'/kiteditor reset'><yellow><bold>[RESET]</bold></click> <click:run_command:'/kiteditor cancel'><red><bold>[CANCEL]</bold></click>"
  editor-not-editing: "<red>You're not editing a kit. Use the book in the lobby."
  editor-bad-layout: "<red>Keep all your kit items in the inventory (armor stays on, nothing in the crafting grid), then save again."
  editor-saved: "<yellow>Layout saved for <gold>{kit}<yellow>!"
  editor-closed: "<yellow>Editor closed."
  editor-reset: "<yellow>Layout reset to default."
  editor-busy: "<red>Leave your duel first."

lobby-items:
  queue:
    slot: 0
    material: IRON_SWORD
    name: "<gold><bold>Unranked Queue"
    lore: ["<gray>Right-click to pick a kit and queue"]
  party-teams:
    slot: 2
    material: RED_BANNER
    name: "<red><bold>Red <gray>vs <blue><bold>Blue <gold>Team Battle"
    lore: ["<gray>Right-click to pick a kit", "<gray>and split the party into two teams"]
  requeue:                          # given to the winner after a match (1v1)
    slot: 0
    material: PAPER
    name: "<gold><bold>Requeue"
    lore: ["<gray>Right-click to queue again", "<gray>Kit: <gold>{kit}"]
  hub:                              # given to the winner after a match
    slot: 8
    material: BARRIER
    name: "<red><bold>Back to Lobby"
    lore: ["<gray>Right-click to go to the lobby now"]
  party-create:
    slot: 1
    material: NAME_TAG
    name: "<yellow><bold>Create Party"
    lore: ["<gray>Right-click to create a party"]
  party-ffa:
    slot: 0
    material: LECTERN
    name: "<gold><bold>Start Party FFA"
    lore: ["<gray>Right-click to pick a kit", "<gray>and start a free-for-all"]
  party-disband:
    slot: 1
    material: BARRIER
    name: "<red><bold>Disband Party"
    lore: ["<gray>Right-click to disband your party"]
  party-leave:
    slot: 1
    material: BARRIER
    name: "<red><bold>Leave Party"
    lore: ["<gray>Right-click to leave the party"]
  editor:
    slot: 2
    material: BOOK
    name: "<gold><bold>Kit Editor"
    lore: ["<gray>Right-click to rearrange your kits"]
  settings:
    slot: 8
    material: COMPARATOR
    name: "<yellow><bold>Settings"
    lore: ["<gray>Scoreboard, nametags, players, requests"]

gui:
  glass: ORANGE_STAINED_GLASS_PANE      # try YELLOW_STAINED_GLASS_PANE or BLACK_STAINED_GLASS_PANE
  menu-rows: 0                          # 0 = automatic size, or 1-6 rows (used by /kit slots)
  amount-shows-fighting: true           # stack number on a kit = players fighting in it (like Minemen)
  kit-name: "<gold><bold>{kit}"
  titles:
    duel: "<gold><bold>Duel <dark_gray>- <gray>select a gamemode"
    queue: "<gold><bold>Unranked <dark_gray>- <gray>select a gamemode"
    ffa: "<gold><bold>Party FFA <dark_gray>- <gray>select a gamemode"
    teams: "<red><bold>Red <gray>vs <blue><bold>Blue <dark_gray>- <gray>select a gamemode"
    editor: "<gold><bold>Kit Editor <dark_gray>- <gray>select a kit"
    settings: "<gold><bold>Settings"
  lore:
    duel:
      - "<gray>Fighting: <white>{fighting}"
      - "<gray>Queued: <white>{queued}"
      - ""
      - "<yellow>Click to challenge!"
    queue:
      - "<gray>Fighting: <white>{fighting}"
      - "<gray>Queued: <white>{queued}"
      - ""
      - "<yellow>Click to join the queue!"
    ffa:
      - "<gray>Fighting: <white>{fighting}"
      - ""
      - "<yellow>Click to start the FFA!"
    teams:
      - "<gray>Fighting: <white>{fighting}"
      - ""
      - "<yellow>Click to start Red vs Blue!"
    editor:
      - ""
      - "<yellow>Click to edit your layout!"
    slots:
      - "<gray>Drag me to the slot you want"
  settings:
    scoreboard:
      name: "Scoreboard"
      description: "Show the sidebar scoreboard"
    nametags:
      name: "Player nametags"
      description: "Show names above players' heads"
    players:
      name: "Show players"
      description: "See other players in the lobby"
    requests:
      name: "Duel requests"
      description: "Receive duel requests"

scoreboard:
  title: "<gradient:#FFE066:#FFA500><bold>DUELS</bold></gradient>"
  lobby:
    - ""
    - "<gold>Online: <white>{online}"
    - "<gold>Fighting: <white>{fighting}"
    - "<gold>Ping: <white>{ping}ms"
    - "<gold>Level: <white>{level}"
    - "<gold>Wins: <white>{wins}"
    - "<gold>Party: <white>{party}"
    - "<gold>Queue: <white>{queue}"
    - ""
    - "{footer}"
  duel:
    - ""
    - "<gold>Opponent: <white>{opponent}"
    - "<gold>Kit: <white>{kit}"
    - "<gold>Time: <white>{time}"
    - ""
    - "<gold>You: <white>{you_ping}ms"
    - "<gold>Them: <white>{them_ping}ms"
    - ""
    - "{footer}"
  team:
    - ""
    - "<gold>Opponent: <white>{opponent}"
    - "<gold>Kit: <white>{kit}"
    - "<gold>Time: <white>{time}"
    - ""
    - "<gold>Team: <white>{team}"
    - "<gold>Alive: <white>{team_alive} <gray>vs <white>{enemy_alive}"
    - ""
    - "{footer}"
  ffa:
    - ""
    - "<gold>Mode: <white>FFA"
    - "<gold>Kit: <white>{kit}"
    - "<gold>Time: <white>{time}"
    - ""
    - "<gold>Alive: <white>{alive}<gray>/{total}"
    - ""
    - "{footer}"
  spectate:
    - ""
    - "<gold>Spectating"
    - "<white>{players}"
    - "<gold>Kit: <white>{kit}"
    - "<gray>/leave to exit"
    - ""
    - "{footer}"

tab:
  header:
    - "<gradient:#FFE066:#FFA500><bold>DUELS</bold></gradient>"
    - "<gray>Online: <gold>{online}"
  footer:
    - "<gray>Ping: <gold>{ping}ms"
    - "<gradient:#FFE066:#FFA500>play.example.net</gradient>"
  name-lobby: "<gold>[{level}] <white>{player}"
  name-fighting: "<red>[Fighting] <white>{player}"
  name-spectating: "<gray>[Spec] <white>{player}"

levels:                             # server levels: the more you win / kill, the higher your level
  xp-per-level: 100                 # level 2 = 100 XP, level 3 = 300, level 4 = 600 ... (xp * N * (N-1) / 2)
  xp-per-win: 30
  xp-per-kill: 10
  xp-per-match: 5                   # given to the loser

uhc:                                # /kit setuhc [kit]  = no natural regen.  /kit goldenhead  = gives you the item
  golden-head:
    material: PLAYER_HEAD
    name: "<gold><bold>Golden Head"
    lore: ["<gray>Right-click to eat", "<gray>Regeneration + Absorption"]
    regen-seconds: 9
    regen-level: 2
    absorption-hearts: 2

leaderboards:                       # /sb spawn ~ ~ ~ wins | kills | deaths | lose | level
  update-seconds: 30
  size: 10
  titles:
    wins: "<gradient:#FFE066:#FFA500><bold>TOP WINS</bold></gradient>"
    kills: "<gradient:#FFE066:#FFA500><bold>TOP KILLS</bold></gradient>"
    deaths: "<gradient:#FFE066:#FFA500><bold>TOP DEATHS</bold></gradient>"
    losses: "<gradient:#FFE066:#FFA500><bold>TOP LOSSES</bold></gradient>"
    level: "<gradient:#FFE066:#FFA500><bold>TOP LEVELS</bold></gradient>"
  line: "<gold>#{rank} <white>{player} <gray>- <yellow>{value}"
  empty: "<gray>No data yet"
  footer: "<gray>Updates every {seconds}s"
